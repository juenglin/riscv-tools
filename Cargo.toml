[package]
name = "riscv-tools"
version = "0.1.0"
edition = "2021"
description = "RISC-V profile probing utilities"

[dependencies]
# ELF parsing — read-only, no alloc dependency needed beyond our own Vec usage.
object   = { version = "0.40", default-features = false, features = ["read"] }
# Error ergonomics
thiserror = "2"
anyhow    = "1"
# CLI argument parsing (derive feature for proc-macro convenience)
clap     = { version = "4", features = ["derive"] }

[lib]
name = "riscv_tools"
path = "src/lib.rs"

[[bin]]
name = "probe-binary"
path = "src/bin/probe_binary.rs"

[[bin]]
name = "probe-host"
path = "src/bin/probe_host.rs"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = false

[profile.release-musl]
inherits = "release"
