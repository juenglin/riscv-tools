name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR / branch.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: check and test (stable)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      # `make check` = cargo fmt --check + cargo clippy -D warnings
      - name: make check
        run: make check

      # `make test` = cargo test (host target, no qemu needed)
      - name: make test
        run: make test
